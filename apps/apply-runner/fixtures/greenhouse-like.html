<!doctype html>
<html><head><title>Apply: Senior Product Manager</title></head>
<body>
<h1>Senior Product Manager</h1>
<form id="application-form" action="/submit" method="post">
  <div class="field"><label for="first_name">First Name *</label><input id="first_name" name="job_application[first_name]" required></div>
  <div class="field"><label for="last_name">Last Name *</label><input id="last_name" name="job_application[last_name]" required></div>
  <div class="field"><label for="email">Email *</label><input id="email" name="job_application[email]" type="email" required></div>
  <div class="field"><label for="phone">Phone</label><input id="phone" name="job_application[phone]"></div>
  <div class="field"><label for="resume">Resume/CV *</label><input id="resume" name="job_application[resume]" type="file" required></div>
  <div class="field"><label for="q1">LinkedIn Profile *</label><input id="q1" name="job_application[answers_attributes][0][text_value]" required></div>
  <div class="field"><label for="q2">What is your notice period? *</label><input id="q2" name="job_application[answers_attributes][1][text_value]" required></div>
  <div class="field"><label for="q3">Are you legally authorised to work in India? *</label>
    <select id="q3" name="job_application[answers_attributes][2][text_value]" required>
      <option value="">Select...</option><option>Yes</option><option>No</option>
    </select></div>
  <div class="field"><label for="q4">Why do you want to work here? *</label><textarea id="q4" name="job_application[answers_attributes][3][text_value]" required></textarea></div>
  <div class="field"><label for="q5">Favourite payment rail and why? *</label><textarea id="q5" name="job_application[answers_attributes][4][text_value]" required></textarea></div>
  <fieldset><legend>Willing to relocate to Bengaluru? *</legend>
    <label><input type="radio" name="reloc" value="y" required> Yes</label>
    <label><input type="radio" name="reloc" value="n"> No</label>
  </fieldset>
  <div class="field"><label for="gender">Gender (voluntary)</label><select id="gender"><option>Decline</option><option>Male</option></select></div>
  <div class="field"><label><input type="checkbox" name="consent" required> I agree to the privacy policy *</label></div>
  <button type="submit">Submit Application</button>
</form>
</body></html>
