name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sifarish
          POSTGRES_PASSWORD: sifarish
          POSTGRES_DB: sifarish_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sifarish" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://sifarish:sifarish@localhost:5432/sifarish_test
      TEST_DATABASE_URL: postgres://sifarish:sifarish@localhost:5432/sifarish_test
      AUTH_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      CRON_SECRET: ci-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm --filter @sifarish/db migrate && pnpm --filter @sifarish/db seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
